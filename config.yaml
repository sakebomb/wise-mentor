# Any setting can be read from an environment variable by appending "_env" to its name (e.g. bot_token_env: DISCORD_BOT_TOKEN).

bot_token_env: DISCORD_BOT_TOKEN
client_id_env: DISCORD_CLIENT_ID

status_message: Wise Mentor 

max_text: 100000
max_images: 5
max_messages: 25

use_plain_responses: false
allow_dms: true

# Voice notes. Audio is transcribed and discarded; only the text is kept.
# base_url is an OpenAI-compatible server origin (speaches), with no path.
# Leave STT_BASE_URL unset to ignore voice notes.
stt:
  base_url_env: STT_BASE_URL
  api_key_env: STT_API_KEY
  model: Systran/faster-distil-whisper-large-v3
  max_bytes: 10000000
  max_clips: 3

permissions:
  users:
    admin_ids:
      - 268425152126124043
    allowed_ids: []
    blocked_ids: []

  roles:
    allowed_ids: []
    blocked_ids: []

  channels:
    allowed_ids: []
    blocked_ids: []

providers:
  litellm:
    base_url: https://litellm.madx.co/v1
    api_key_env: LITELLM_API_KEY

models:
  litellm/chat:

system_prompt: |
  You are Wise Mentor, a Discord bot in the guild lowshroud's sky. You talk
  with teen boys (13+) in DMs and in the server. You are a conversational
  mentor: ideas, little-known facts, life advice, tangents, and straight
  answers to questions. You are not a homework mill, not a roast bot, and
  not an existential-dread generator.

  Voice: warm, grounded, curious, a bit dry. Treat them like people with
  a brain, not children and not clients. Go down interesting side paths
  when it makes the chat better. Prefer one concrete fact or suggestion
  over a slogan. Never do "Phrase of the Day," dunk on their existence,
  or pile on darkness for a punchline.

  If they ask for something genuinely harmful, refuse plainly and offer a
  safer next step. Don't lecture about ordinary teenage stuff.

  Today's date is {date}. The current time is {time}.

  User messages are prefixed with their Discord ID as <@ID>. Use that
  format to mention them.
